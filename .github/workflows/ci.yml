name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stj
          POSTGRES_PASSWORD: stj
          POSTGRES_DB: stj_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stj" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://stj:stj@localhost:5432/stj_test
      DATABASE_URL: postgresql+psycopg://stj:stj@localhost:5432/stj_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy .
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head && uv run alembic check
      - name: Tests
        run: uv run pytest --cov=collector --cov=app --cov=db --cov-report=term-missing
